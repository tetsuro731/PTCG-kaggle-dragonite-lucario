<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="550" viewBox="0 0 1500 550" role="img" aria-labelledby="title desc">
  <title id="title">CatBoost training flow</title>
  <desc id="desc">Winning Mega Lucario ex replays from top 20 teams are converted into features and used to train the final CatBoost model.</desc>

  <defs>
    <marker id="arrow" markerWidth="28" markerHeight="28" refX="28" refY="14" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 28 28">
      <path d="M0 0 L28 14 L0 28 Z" fill="#56616d"/>
    </marker>
  </defs>

  <rect width="1500" height="550" fill="#ffffff"/>

  <g transform="translate(0 -100)">
  <rect x="35" y="165" width="320" height="370" rx="8" fill="#edf5fa" stroke="#246b9e" stroke-width="3"/>
  <image x="55" y="180" width="280" height="135" href="lb.png" preserveAspectRatio="xMidYMid meet"/>
  <text x="195" y="355" text-anchor="middle" fill="#17212b" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="30" font-weight="700">Winning replays</text>
  <text x="195" y="395" text-anchor="middle" fill="#59636e" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="25" font-weight="600">Top 20 teams</text>
  <text x="195" y="430" text-anchor="middle" fill="#59636e" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="25" font-weight="600">Mega Lucario ex</text>
  <text x="195" y="495" text-anchor="middle" fill="#246b9e" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="28" font-weight="700">1,558 episodes</text>

  <g transform="translate(-77 0)">
  <rect x="650" y="165" width="400" height="370" rx="8" fill="#ffffff" stroke="#d9a900" stroke-width="4"/>
  <g transform="translate(700 190)">
    <polygon points="0,0 78,0 108,50 78,100 0,100" fill="#ffcc00"/>
    <line x1="50" y1="67" x2="28" y2="42" stroke="#ffffff" stroke-width="4"/>
    <line x1="50" y1="67" x2="49" y2="27" stroke="#ffffff" stroke-width="4"/>
    <line x1="50" y1="67" x2="72" y2="26" stroke="#e60012" stroke-width="4"/>
    <line x1="50" y1="67" x2="87" y2="43" stroke="#ffffff" stroke-width="4"/>
    <circle cx="28" cy="42" r="8" fill="#ffffff"/>
    <circle cx="49" cy="27" r="11" fill="#ffffff"/>
    <circle cx="72" cy="26" r="11" fill="#e60012"/>
    <circle cx="87" cy="43" r="8" fill="#ffffff"/>
    <circle cx="50" cy="67" r="17" fill="#e60012"/>
  </g>
  <text x="900" y="252" text-anchor="middle" fill="#111820" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="36" font-weight="700">CatBoost</text>
  <line x1="710" y1="315" x2="990" y2="315" stroke="#ead47f" stroke-width="2"/>
  <text x="850" y="365" text-anchor="middle" fill="#59636e" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="25" font-weight="600">90,029 decisions</text>
  <text x="850" y="405" text-anchor="middle" fill="#59636e" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="25" font-weight="600">688,908 candidate rows</text>
  <text x="850" y="485" text-anchor="middle" fill="#a56b00" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="26" font-weight="700">Imitation learning</text>
  </g>

  <rect x="1190" y="255" width="280" height="190" rx="8" fill="#173f5f"/>
  <text x="1330" y="320" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="29" font-weight="700">Trained model</text>
  <line x1="1240" y1="345" x2="1420" y2="345" stroke="#85a8c0" stroke-width="2"/>
  <text x="1330" y="400" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="28" font-weight="700">3,373 trees</text>

  <path d="M355 350 H573" fill="none" stroke="#56616d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="464" y="270" text-anchor="middle" fill="#a56b00" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="24" font-weight="700">Feature</text>
  <text x="464" y="299" text-anchor="middle" fill="#a56b00" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="24" font-weight="700">extraction</text>
  <text x="464" y="328" text-anchor="middle" fill="#a56b00" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="24" font-weight="700">(740 features)</text>

  <path d="M973 350 H1190" fill="none" stroke="#56616d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1082" y="325" text-anchor="middle" fill="#59636e" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="28" font-weight="700">Train</text>
  </g>

  <text x="750" y="535" text-anchor="middle" fill="#202020" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="22" letter-spacing="0">Fig. 5. Training pipeline</text>
</svg>
